# Mirrors cc-gitops apps/nats/values-management.yaml plus auth callout.
# EXAMPLE credentials only, see ../../.devcontainer/nkey/README.md.

server_name: management
http_port: 8222

jetstream {
  store_dir: /data
}

mqtt {
  port: 1883
}

accounts {
  # Holds only the callout user; requests are published here.
  AUTH {
    users: [ { user: auth-callout, password: auth-callout } ]
  }
  MQTT {
    jetstream: enabled
    users: [
      { user: mqtt, password: mqtt, permissions: { subscribe: ">", publish: ">" } }
    ]
  }
  AUDIT {
    jetstream: enabled
    users: [
      {
        user: audit, password: audit
        permissions: {
          publish: { allow: ["AUDIT.>", "$JS.API.>", "$JS.ACK.>", "_INBOX.>"] }
          subscribe: { allow: ["AUDIT.>", "_INBOX.>"] }
        }
      }
    ]
  }
  $SYS {
    users: [ { user: sys, password: sys } ]
  }
}
system_account: "$SYS"

no_auth_user: mqtt

authorization {
  auth_callout {
    issuer: AARWWQ5UIPIIBO5OES5YXQV2HOOUCP6SA7EKKZFDTYICW4U4UETT3XLS
    xkey: XCNO6QXNYUOBP7WSTRTL24BYVF7QGQLSKTH5LFELCUHLUFB2BDVF2CRD
    account: AUTH
    auth_users: [ auth-callout, mqtt, audit, sys ]
  }
}
