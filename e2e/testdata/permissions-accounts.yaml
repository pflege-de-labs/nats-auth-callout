# Role mapping for the named-accounts deployment (see nats-accounts.conf).
issuers:
  - url: http://placeholder/realms/test # replaced by the test
    audience: nats
    roleClient: nats

roles:
  nats-audit-read:
    account: AUDIT
    sub:
      allow: ["AUDIT.>", "_INBOX.>"]
    # Read-only JetStream: no stream/consumer delete, no durable consumers.
    pub:
      allow:
        - "$JS.API.INFO"
        - "$JS.API.STREAM.NAMES"
        - "$JS.API.STREAM.LIST"
        - "$JS.API.STREAM.INFO.*"
        - "$JS.API.CONSUMER.CREATE.*.>"
        - "$JS.API.CONSUMER.INFO.*.>"
        - "$JS.API.CONSUMER.MSG.NEXT.*.>"
        - "$JS.ACK.*.>"
  nats-mqtt:
    account: MQTT
    # MQTT "devices/#" also matches the parent topic, so allow it explicitly.
    pub:
      allow: ["devices", "devices.>"]
    sub:
      allow: ["devices", "devices.>"]
