{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nats-auth-callout.fullname" . }}
  labels:
    {{- include "nats-auth-callout.labels" . | nindent 4 }}
type: Opaque
stringData:
  issuer-seed: {{ required "secret.values.issuerSeed is required" .Values.secret.values.issuerSeed | quote }}
  password: {{ required "secret.values.password is required" .Values.secret.values.password | quote }}
  {{- if .Values.xkey.enabled }}
  xkey-seed: {{ required "secret.values.xkeySeed is required when xkey.enabled" .Values.secret.values.xkeySeed | quote }}
  {{- end }}
{{- end }}
