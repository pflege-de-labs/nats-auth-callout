name: "nats-auth-callout"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ../..:/workspaces:cached
      - ./config:/home/vscode/.config
      - ./nkey:/etc/nkey:ro
      - ./callout:/etc/nats-auth-callout:ro
    command: sleep infinity
    networks:
      - nats

  nats:
    # Version used by the e2e global-account tests.
    image: nats:2.12.6-alpine
    volumes:
      - js-data:/data
      - ./nats:/conf:ro
    command: ["-c", "/conf/nats.conf"]
    networks:
      - nats

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    command: ["start-dev", "--import-realm"]
    networks:
      - nats

volumes:
  js-data:

networks:
  nats:
