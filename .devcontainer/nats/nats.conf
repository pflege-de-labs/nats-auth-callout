# Static users in the global account ($G)
# plus auth callout. EXAMPLE credentials only, see ../nkey/README.md.

server_name: dev
http_port: 8222

jetstream {
  store_dir: /data
}

authorization {
  users: [
    { user: auth-callout, password: auth-callout }
    # Target of no_auth_user, like anonymous and legacy clients.
    { user: legacy, password: legacy }
    {
      user: keycloak, password: keycloak
      permissions: { publish: { allow: ["keycloak.>", "KEYCLOAK.EVENTS.>"] } }
    }
    { nkey: UDZV37JYJ25PCIY7GFWE2U2ZE6XDJSHI67FRUANOCAX5MUMLOFMJJ76R }
  ]

  auth_callout {
    issuer: AARWWQ5UIPIIBO5OES5YXQV2HOOUCP6SA7EKKZFDTYICW4U4UETT3XLS
    xkey: XCNO6QXNYUOBP7WSTRTL24BYVF7QGQLSKTH5LFELCUHLUFB2BDVF2CRD
    # Quoted: unquoted $G is a variable reference in NATS config.
    account: "$G"
    # Everyone listed here bypasses the callout, including users of other accounts.
    auth_users: [
      auth-callout
      legacy
      keycloak
      UDZV37JYJ25PCIY7GFWE2U2ZE6XDJSHI67FRUANOCAX5MUMLOFMJJ76R
      sys
      UC64VAZFUIL3XLNHGO7PB7YSV3XZ2NOR4THWA5D2CYK7EGVXYN7QHSCD
    ]
  }
}

no_auth_user: legacy

# Browser clients connect here; TLS is usually terminated in front of NATS.
websocket {
  port: 8080
  no_tls: true
}

accounts {
  $SYS {
    users: [
      { user: sys, password: sys }
      { nkey: UC64VAZFUIL3XLNHGO7PB7YSV3XZ2NOR4THWA5D2CYK7EGVXYN7QHSCD }
    ]
  }
}
system_account: "$SYS"
