name: release

# Image releases: a v* tag on main. The chart is released by chart.yml on its own version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  guard:
    uses: pflege-de-labs/github-workflows/.github/workflows/release-guard.yml@cef33cface64a7ac3c33a5a8aea652095de518f7 # v1.1.0

  # The release rebuilds its artifacts, so the tagged commit is gated here rather than by main's last CI run.
  verify:
    needs: guard
    uses: pflege-de-labs/github-workflows/.github/workflows/go-checks.yml@cef33cface64a7ac3c33a5a8aea652095de518f7 # v1.1.0
    with:
      test-command: go test -race -coverprofile=coverage.out ./internal/...
      coverage-threshold: 75
      # renovate: datasource=go depName=github.com/securego/gosec/v2
      gosec-version: v2.29.0

  image:
    needs: verify
    uses: pflege-de-labs/github-workflows/.github/workflows/image-release.yml@cef33cface64a7ac3c33a5a8aea652095de518f7 # v1.1.0
    permissions:
      contents: read
      packages: write
      id-token: write

  secobserve:
    needs: image
    uses: pflege-de-labs/github-workflows/.github/workflows/secobserve-image.yml@cef33cface64a7ac3c33a5a8aea652095de518f7 # v1.1.0
    permissions:
      contents: read
      packages: read
    with:
      image: ${{ needs.image.outputs.image }}
      digest: ${{ needs.image.outputs.digest }}
      tag: ${{ github.ref_name }}
    secrets:
      SO_API_TOKEN: ${{ secrets.SO_API_TOKEN }}
