name: chart

on:
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/chart.yml"
  # No path filter: path filters and tags don't combine reliably, and linting is cheap.
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  CHART: charts/nats-auth-callout
  REGISTRY: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.2.4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint and validate every values variant in ci/
        run: |
          for values in "$CHART"/ci/*.yaml; do
            echo "::group::$values"
            helm lint --strict "$CHART" -f "$values"
            helm template ci "$CHART" -f "$values" |
              go run github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0 -strict -summary \
                -kubernetes-version 1.33.0 \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing via GitHub OIDC.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.2.4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Package and push
        id: push
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $TAG is not a semver version" >&2
            exit 1
          fi
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          # The release tag also selects the image (appVersion), see image.yml.
          helm package "$CHART" --version "$version" --app-version "$version" --destination dist
          helm push "dist/nats-auth-callout-${version}.tgz" "oci://$REGISTRY" 2>&1 | tee push.txt
          digest=$(awk '/^Digest:/ { print $2 }' push.txt)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "could not read chart digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign chart
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REGISTRY/nats-auth-callout@${DIGEST}"
